name: Build AmneziaWG Packages

on:
  workflow_call:
    inputs:
      awg_kmod_tag:
        required: true
        type: string
        description: 'Full kmod source tag, e.g. v1.0.20260329-2'
      awg_tools_tag:
        required: true
        type: string
        description: 'Full tools source tag, e.g. v1.0.20260223'
      iwrt_version:
        required: true
        type: string
        description: 'ImmortalWRT version, e.g. 24.10.6'
  workflow_dispatch:
    inputs:
      awg_kmod_tag:
        required: false
        type: string
        description: 'Full kmod source tag (auto-detect latest if empty)'
      awg_tools_tag:
        required: false
        type: string
        description: 'Full tools source tag (auto-detect latest if empty)'
      iwrt_version:
        required: true
        type: string
        description: 'ImmortalWRT version, e.g. 24.10.6'
      targets:
        required: false
        type: string
        description: 'Targets to build (comma-separated, optional)'
      subtargets:
        required: false
        type: string
        description: 'Subtargets to build (comma-separated, optional)'

permissions:
  contents: write
  actions: write

jobs:
  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      kmod-tag: ${{ steps.resolve.outputs.kmod-tag }}
      kmod-version: ${{ steps.resolve.outputs.kmod-version }}
      tools-tag: ${{ steps.resolve.outputs.tools-tag }}
      tools-version: ${{ steps.resolve.outputs.tools-version }}
      iwrt-version: ${{ steps.resolve.outputs.iwrt-version }}
      release-tag: ${{ steps.resolve.outputs.release-tag }}
      release-body: ${{ steps.resolve.outputs.release-body }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve versions
        id: resolve
        run: |
          KMOD_TAG="${{ inputs.awg_kmod_tag }}"
          TOOLS_TAG="${{ inputs.awg_tools_tag }}"
          IWRT_VER="${{ inputs.iwrt_version }}"

          # -------------------------------------------------------
          # Auto-detect latest AWG tags if not provided (workflow_dispatch)
          # -------------------------------------------------------
          if [ -z "$KMOD_TAG" ]; then
            echo "::group::Auto-detecting latest kmod tag"
            KMOD_TAG=$(
              git ls-remote --tags https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git \
                | awk -F'\t' '{print $2}' \
                | sed 's|refs/tags/||' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]{8}(-[0-9]+)?$' \
                | awk '{
                    tag = $0
                    sub(/^v/, "", tag)
                    if (match(tag, /([0-9]{8})/, d)) { date = d[1] } else { next }
                    if (match(tag, /-([0-9]+)$/, p)) { patch = p[1]+0 } else { patch = 0 }
                    printf "%s %03d %s\n", date, patch, $0
                  }' \
                | sort -k1,1 -k2,2n \
                | tail -1 \
                | awk '{print $3}'
            )
            echo "Detected kmod tag: $KMOD_TAG"
            echo "::endgroup::"
          fi

          if [ -z "$TOOLS_TAG" ]; then
            echo "::group::Auto-detecting latest tools tag"
            TOOLS_TAG=$(
              git ls-remote --tags https://github.com/amnezia-vpn/amneziawg-tools.git \
                | awk -F'\t' '{print $2}' \
                | sed 's|refs/tags/||' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]{8}(-[0-9]+)?$' \
                | awk '{
                    tag = $0
                    sub(/^v/, "", tag)
                    if (match(tag, /([0-9]{8})/, d)) { date = d[1] } else { next }
                    if (match(tag, /-([0-9]+)$/, p)) { patch = p[1]+0 } else { patch = 0 }
                    printf "%s %03d %s\n", date, patch, $0
                  }' \
                | sort -k1,1 -k2,2n \
                | tail -1 \
                | awk '{print $3}'
            )
            echo "Detected tools tag: $TOOLS_TAG"
            echo "::endgroup::"
          fi

          # -------------------------------------------------------
          # Extract base versions (strip v prefix and -N suffix)
          # -------------------------------------------------------
          KMOD_TAG_NO_V=$(echo "$KMOD_TAG" | sed 's/^v//')
          KMOD_VER=$(echo "$KMOD_TAG_NO_V" | sed 's/-[0-9]*$//')
          TOOLS_TAG_NO_V=$(echo "$TOOLS_TAG" | sed 's/^v//')
          TOOLS_VER=$(echo "$TOOLS_TAG_NO_V" | sed 's/-[0-9]*$//')

          # -------------------------------------------------------
          # Compute release tag
          # Format: {tools_ver}-v{iwrt_ver}
          #   or:   {tools_ver}_kmod{kmod_full_tag_no_v}-v{iwrt_ver}  (when kmod differs)
          # -------------------------------------------------------
          RELEASE_TAG="${TOOLS_VER}-v${IWRT_VER}"
          if [ "$KMOD_TAG_NO_V" != "$TOOLS_VER" ]; then
            RELEASE_TAG="${TOOLS_VER}_kmod${KMOD_TAG_NO_V}-v${IWRT_VER}"
          fi

          # -------------------------------------------------------
          # Build release body
          # -------------------------------------------------------
          BUILD_DATE=$(date -u +%Y-%m-%d)

          # Build release body (using echo to avoid heredoc indentation issues)
          {
            echo "## AmneziaWG for ImmortalWRT ${IWRT_VER}"
            echo ""
            echo "| Component | Version | Source Tag |"
            echo "|-----------|---------|------------|"
            echo "| Kernel Module | \`${KMOD_VER}\` | \`${KMOD_TAG}\` |"
            echo "| Tools | \`${TOOLS_VER}\` | \`${TOOLS_TAG}\` |"
            echo ""
            echo "**Built on ${BUILD_DATE}**"
          } > /tmp/release_body.md

          # -------------------------------------------------------
          # Export all outputs
          # -------------------------------------------------------
          echo "kmod-tag=${KMOD_TAG}" >> "$GITHUB_OUTPUT"
          echo "kmod-version=${KMOD_VER}" >> "$GITHUB_OUTPUT"
          echo "tools-tag=${TOOLS_TAG}" >> "$GITHUB_OUTPUT"
          echo "tools-version=${TOOLS_VER}" >> "$GITHUB_OUTPUT"
          echo "iwrt-version=${IWRT_VER}" >> "$GITHUB_OUTPUT"
          echo "release-tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          # Multi-line output for release body
          {
            echo "release-body<<BODY_EOF"
            cat /tmp/release_body.md
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "### Resolved versions"
          echo "kmod_tag      = $KMOD_TAG"
          echo "kmod_version  = $KMOD_VER"
          echo "tools_tag     = $TOOLS_TAG"
          echo "tools_version = $TOOLS_VER"
          echo "iwrt_version  = $IWRT_VER"
          echo "release_tag   = $RELEASE_TAG"

  generate-config:
    runs-on: ubuntu-latest
    needs: resolve-versions
    outputs:
      job-config: ${{ steps.generate-config.outputs.job-config }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Generate Job Config
        id: generate-config
        run: |
          TARGETS="${{ inputs.targets }}"
          SUBTARGETS="${{ inputs.subtargets }}"
          node index.js "${{ needs.resolve-versions.outputs.iwrt-version }}" "${TARGETS}" "${SUBTARGETS}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: "v${{ needs.resolve-versions.outputs.iwrt-version }} - ${{ matrix.build_env.pkgarch }} :: ${{ matrix.build_env.target }}/${{ matrix.build_env.subtarget }} build"
    runs-on: ubuntu-latest
    needs: [resolve-versions, generate-config]
    strategy:
      matrix:
        build_env: ${{ fromJson(needs.generate-config.outputs.job-config) }}
      fail-fast: false

    steps:
      - name: Checkout AWG source code
        uses: actions/checkout@v7

      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools

      - name: Cache ImmortalWrt SDK
        id: cache-sdk
        uses: actions/cache@v5
        env:
          cache-name: "cache-sdk-${{ matrix.build_env.tag }}-${{ matrix.build_env.target }}-${{ matrix.build_env.subtarget }}"
        with:
          path: immortalwrt-sdk-*/
          key: ${{ runner.os }}-sdk-${{ env.cache-name }}

      - name: Download and extract ImmortalWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          echo "pkgarch: ${{ matrix.build_env.pkgarch }}, target:${{ matrix.build_env.target }}, subtarget: ${{ matrix.build_env.subtarget }}"

          SDK_FILE=$(curl -s "https://downloads.immortalwrt.org/releases/${{ matrix.build_env.tag }}/targets/${{ matrix.build_env.target }}/${{ matrix.build_env.subtarget }}/" | grep -o "immortalwrt-sdk-${{ matrix.build_env.tag }}-${{ matrix.build_env.target }}-${{ matrix.build_env.subtarget }}_gcc-[^\"]*_musl[^\"]*\.Linux-x86_64\.tar\.[xz|zst]*" | head -n1)

          if [ -z "$SDK_FILE" ]; then
            echo "SDK file not found for ${{ matrix.build_env.tag }} ${{ matrix.build_env.target }} ${{ matrix.build_env.subtarget }}"
            exit 1
          fi

          SDK_DOWNLOAD_URL="https://downloads.immortalwrt.org/releases/${{ matrix.build_env.tag }}/targets/${{ matrix.build_env.target }}/${{ matrix.build_env.subtarget }}/${SDK_FILE}"
          echo "Downloading SDK: $SDK_DOWNLOAD_URL"

          wget "$SDK_DOWNLOAD_URL"

          if [[ "$SDK_FILE" == *.tar.zst ]]; then
            tar --zstd -xf "$SDK_FILE"
          elif [[ "$SDK_FILE" == *.tar.xz ]]; then
            tar -xf "$SDK_FILE"
          else
            echo "Unknown archive format: $SDK_FILE"
            exit 1
          fi

          rm "$SDK_FILE"

      - name: Setup SDK, inject versions, and configure feeds
        run: |
          SDK_DIR=$(find . -maxdepth 1 -name "immortalwrt-sdk-*" -type d | head -n1)
          SDK_DIR=$(realpath "$SDK_DIR")

          if [ -z "$SDK_DIR" ]; then
            echo "SDK directory not found"
            exit 1
          fi

          WORKSPACE_DIR=$(pwd)
          cd "$SDK_DIR"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Initialize git in luci feed so i18n sub-packages get correct version
          LUCI_PROTO_VER=$(sed -n 's/^PKG_VERSION:=//p' "$WORKSPACE_DIR/luci-proto-amneziawg/Makefile")
          cd feeds/luci
          git init -q
          git config user.email "build@github.actions"
          git config user.name "Build"
          git add -A
          git commit -q -m "v$LUCI_PROTO_VER"
          git tag "v$LUCI_PROTO_VER"
          cd "$SDK_DIR"

          cp -r "$WORKSPACE_DIR/kmod-amneziawg" package/
          cp -r "$WORKSPACE_DIR/amneziawg-tools" package/
          cp -r "$WORKSPACE_DIR/luci-proto-amneziawg" package/

          
          # Initialize git in proto package dir so luci.mk version detection works
          cd package/luci-proto-amneziawg
          git init -q
          git config user.email "build@github.actions"
          git config user.name "Build"
          git add -A
          git commit -q -m "v$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          git tag "v$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          cd "$SDK_DIR"

          # Inject versions via sed placeholder substitution
          sed -i "s/__AWG_KMOD_VERSION__/${{ needs.resolve-versions.outputs.kmod-version }}/" package/kmod-amneziawg/Makefile
          sed -i "s/__AWG_KMOD_TAG__/${{ needs.resolve-versions.outputs.kmod-tag }}/" package/kmod-amneziawg/Makefile
          sed -i "s/__AWG_TOOLS_VERSION__/${{ needs.resolve-versions.outputs.tools-version }}/" package/amneziawg-tools/Makefile
          sed -i "s/__AWG_TOOLS_TAG__/${{ needs.resolve-versions.outputs.tools-tag }}/" package/amneziawg-tools/Makefile
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" > .config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-amneziawg=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-amneziawg-ru=y" >> .config

          make defconfig

      - name: Build AmneziaWG packages
        run: |
          SDK_DIR=$(find . -maxdepth 1 -name "immortalwrt-sdk-*" -type d | head -n1)
          cd "$SDK_DIR"

          echo "Building AmneziaWG packages..."

          echo "Building kmod-amneziawg..."
          make package/kmod-amneziawg/{download,prepare} V=s || true
          make package/kmod-amneziawg/compile V=s || true

          echo "Building luci-proto-amneziawg..."
          make package/luci-proto-amneziawg/{download,prepare} V=s
          make package/luci-proto-amneziawg/compile V=s

          echo "Building amneziawg-tools..."
          make package/amneziawg-tools/{download,prepare} V=s
          make package/amneziawg-tools/compile V=s

          echo "Build completed. Checking for built packages..."
          find bin/ -name "*.?pk" | grep -E "(amneziawg|luci-proto-amneziawg|luci-i18n-amneziawg)" | head -10

      - name: Prepare artifacts
        run: |
          SDK_DIR=$(find . -maxdepth 1 -name "immortalwrt-sdk-*" -type d | head -n1)

          mkdir -p awgrelease

          KMOD_VER="${{ needs.resolve-versions.outputs.kmod-version }}"
          TOOLS_VER="${{ needs.resolve-versions.outputs.tools-version }}"
          IWRT_VER="${{ matrix.build_env.tag }}"
          PKGARCH="${{ matrix.build_env.pkgarch }}"
          TARGET="${{ matrix.build_env.target }}"
          SUBTARGET="${{ matrix.build_env.subtarget }}"

          # kmod-amneziawg
          KMOD_POSTFIX="_${KMOD_VER}_v${IWRT_VER}_${PKGARCH}_${TARGET}_${SUBTARGET}"
          find "$SDK_DIR/bin/targets" -name "kmod-amneziawg*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/kmod-amneziawg${postfix}.${ext}"' _ {} "${KMOD_POSTFIX}" \; || echo "kmod-amneziawg package not found"

          # amneziawg-tools
          TOOLS_POSTFIX="_${TOOLS_VER}_v${IWRT_VER}_${PKGARCH}_${TARGET}_${SUBTARGET}"
          find "$SDK_DIR/bin/packages" -name "amneziawg-tools*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/amneziawg-tools${postfix}.${ext}"' _ {} "${TOOLS_POSTFIX}" \; || echo "amneziawg-tools package not found"

          # luci-proto-amneziawg
          LUCI_POSTFIX="_$(sed -n 's/^PKG_VERSION:=//p' luci-proto-amneziawg/Makefile)_v${IWRT_VER}_${PKGARCH}_${TARGET}_${SUBTARGET}"
          find "$SDK_DIR/bin/packages" -name "luci-proto-amneziawg*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/luci-proto-amneziawg${postfix}.${ext}"' _ {} "${LUCI_POSTFIX}" \; || echo "luci-proto-amneziawg package not found"

          # luci-i18n-amneziawg-ru
          find "$SDK_DIR/bin/packages" -name "luci-i18n-amneziawg-ru*.?pk" -exec sh -c 'file="$1"; postfix="$2"; ext="${file##*.}"; cp "$file" "awgrelease/luci-i18n-amneziawg-ru${postfix}.${ext}"' _ {} "${LUCI_POSTFIX}" \; || echo "luci-i18n-amneziawg-ru package not found"

          echo "Built packages:"
          ls -la awgrelease/

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-versions.outputs.release-tag }}
          body: ${{ needs.resolve-versions.outputs.release-body }}
          files: awgrelease/*.?pk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}